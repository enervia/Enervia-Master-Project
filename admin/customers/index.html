<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia | Customer CRM</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1250px;margin:32px auto;padding:0 20px}.back{color:#167d73;text-decoration:none}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}select,input,button{padding:10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}button{background:#172033;color:#fff;cursor:pointer}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin:10px 0}.row{display:grid;grid-template-columns:1.3fr 1fr 1fr 160px 230px;gap:16px;align-items:center}.status{font-weight:700}.actions{display:flex;gap:8px;align-items:center}.empty{text-align:center;padding:40px}@media(max-width:1000px){.row{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="../rfq/">← RFQ Management</a><h1>Customer CRM</h1><div style="color:#667085">Customer registration, company approval and portal access.</div><div class="toolbar"><input id="search" placeholder="Search company, email, tax ID..."><button onclick="load()">Refresh</button></div><div id="list" class="card empty">Loading...</div></div><script>let all=[];function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}function render(){const q=document.getElementById("search").value.toLowerCase();const rows=all.filter(x=>[x.legal_name,x.email,x.tax_id,x.city].some(v=>String(v??"").toLowerCase().includes(q)));const el=document.getElementById("list");if(!rows.length){el.textContent="No customers found.";return}el.className="";el.innerHTML=rows.map(x=>'<div class="card row"><div><strong>'+esc(x.legal_name)+'</strong><br><small>'+esc(x.email||"")+'</small></div><div>'+esc(x.industry||"—")+'<br><small>'+esc(x.city||"")+'</small></div><div>'+esc(x.tax_id||"—")+'</div><div class="status">'+esc(x.status)+'</div><div class="actions"><select data-id="'+esc(x.id)+'"><option>PENDING</option><option>ACTIVE</option><option>SUSPENDED</option></select><button onclick="save(\''+esc(x.id)+'\',this)">Save</button></div></div>').join("");rows.forEach(x=>{const s=document.querySelector('select[data-id="'+CSS.escape(x.id)+'"]');if(s)s.value=x.status})}async function load(){const r=await fetch("/api/admin/customers");const d=await r.json();if(!r.ok||!d.ok){document.getElementById("list").textContent=d.error||"Unable to load customers";return}all=d.customers||[];render()}async function save(id,b){const s=document.querySelector('select[data-id="'+CSS.escape(id)+'"]');b.disabled=true;const r=await fetch("/api/admin/customer-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({companyId:id,status:s.value})});const d=await r.json();b.disabled=false;if(!r.ok||!d.ok){alert(d.error||"Update failed");return}await load()}document.getElementById("search").addEventListener("input",render);load();</script></body></html>
