<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia RFQ Admin</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1250px;margin:32px auto;padding:0 20px}h1{margin-bottom:6px}.muted{color:#667085}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}select,input,button{padding:10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}button{cursor:pointer;background:#172033;color:white}button.secondary{background:white;color:#172033}.card{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin:10px 0}.row{display:grid;grid-template-columns:150px minmax(300px,1fr) 190px 185px 360px;gap:14px;align-items:center}.row>span{min-width:0}.row>span:nth-of-type(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row>span:nth-of-type(3){white-space:nowrap}.row .actions{min-width:0}.row span,.row b{min-width:0}.status{font-weight:700;white-space:nowrap}.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end}.actions select{width:155px;min-width:155px}.actions button{white-space:nowrap}.actions button{padding:9px 12px}.empty{text-align:center;padding:40px}.count{margin-left:auto;color:#667085;font-size:13px}.toolbar .search{min-width:260px;flex:1}.msg{position:fixed;right:22px;bottom:22px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;display:none;box-shadow:0 8px 25px rgba(0,0,0,.15)}@media(max-width:1150px){.row{grid-template-columns:130px minmax(240px,1fr) 170px 180px}.actions{grid-column:1/-1;justify-content:flex-start}}@media(max-width:700px){.row{grid-template-columns:1fr;gap:8px}.status{white-space:normal}.actions{grid-column:auto;display:flex;flex-wrap:wrap}.actions select{width:auto;flex:1;min-width:160px}.toolbar .search{min-width:180px;width:100%}}</style></head><body><div class="wrap">
<div style="display:flex;align-items:end;gap:15px"><div><h1>RFQ Inbox</h1><div class="muted">Enervia procurement workflow — management console</div></div><div class="count" id="count"></div></div>
<div class="toolbar"><select id="statusFilter"><option value="">All statuses</option><option>NEW</option><option>REVIEW</option><option>SOURCING</option><option>PRICING</option><option>PENDING_APPROVAL</option><option>QUOTED</option><option>CLOSED</option></select><input id="search" class="search" placeholder="Search RFQ, company, project, email..."><button onclick="load()">Refresh</button></div>
<div id="list" class="card empty">Loading...</div></div><div id="msg" class="msg"></div>
<script>
const statuses=["NEW","REVIEW","SOURCING","PRICING","PENDING_APPROVAL","QUOTED","CLOSED"];let all=[];
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function formatDate(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?"—":d.toLocaleString()}
function showMsg(t){const m=document.getElementById("msg");m.textContent=t;m.style.display="block";clearTimeout(window.msgTimer);window.msgTimer=setTimeout(()=>m.style.display="none",2500)}
function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const filtered=all.filter(x=>!q||[x.rfq_id,x.company,x.project_name,x.email,x.contact_name,x.status].some(v=>String(v??"").toLowerCase().includes(q)));
 document.getElementById("count").textContent=filtered.length+" RFQ"+(filtered.length===1?"":"s");
 const el=document.getElementById("list");
 if(!filtered.length){el.textContent="No RFQs found.";return}
 el.className="";
 el.innerHTML=filtered.map(x=>'<div class="card row"><b><a href="detail.html?id='+encodeURIComponent(x.rfq_id)+'" style="color:#172033;text-decoration:none">'+esc(x.rfq_id)+'</a></b><span><strong>'+esc(x.company)+'</strong><br><small>'+esc(x.project_name||"No project")+'</small><br><small>'+esc(x.contact_name||"")+' · '+esc(x.email||"")+'</small></span><span class="status">'+esc(x.status)+'</span><span>'+formatDate(x.submitted_at)+'</span><div class="actions"><select data-status="'+esc(x.rfq_id)+'">'+statuses.map(s=>'<option '+(s===x.status?"selected":"")+'>'+s+'</option>').join("")+'</select><button onclick="saveStatus(\''+esc(x.rfq_id).replace(/'/g,"\\'")+'\',this)">Save</button><button class="secondary" onclick="location.href=\'detail.html?id='+encodeURIComponent(x.rfq_id)+'\'">Manage</button></div></div>').join("");
}
async function load(){const s=document.getElementById("statusFilter").value;const r=await fetch("/api/admin/rfqs"+(s?"?status="+encodeURIComponent(s):""));const d=await r.json();if(!r.ok||!d.ok){document.getElementById("list").textContent=d.error||"Unable to load RFQs";return}all=d.rfqs||[];render()}
async function saveStatus(id,btn){const select=document.querySelector('select[data-status="'+CSS.escape(id)+'"]');btn.disabled=true;const r=await fetch("/api/admin/rfq-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rfqId:id,status:select.value,changedBy:"admin"})});const d=await r.json();btn.disabled=false;if(!r.ok||!d.ok){showMsg(d.error||"Status update failed");return}showMsg("RFQ "+id+" status updated.");await load()}
document.getElementById("statusFilter").addEventListener("change",load);document.getElementById("search").addEventListener("input",render);load();
</script></body></html>
