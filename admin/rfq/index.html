<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia RFQ Admin</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:1200px;margin:32px auto;padding:0 20px}h1{margin-bottom:6px}.muted{color:#667085}.toolbar{display:flex;gap:10px;margin:22px 0}select,button{padding:10px;border:1px solid #d0d5dd;border-radius:8px}button{cursor:pointer;background:#172033;color:white}.card{background:white;border:1px solid #e4e7ec;border-radius:12px;padding:16px;margin:10px 0}.row{display:grid;grid-template-columns:150px minmax(300px,1fr) 190px 220px;gap:20px;align-items:center}.row span,.row b{min-width:0}.row .status{white-space:nowrap}.row>a{overflow:hidden;text-overflow:ellipsis}.status{font-weight:700}.empty{text-align:center;padding:40px}</style></head><body><div class="wrap"><h1>RFQ Inbox</h1><div class="muted">Enervia procurement workflow</div><div class="toolbar"><select id="status"><option value="">All statuses</option><option>NEW</option><option>REVIEW</option><option>SOURCING</option><option>PRICING</option><option>PENDING_APPROVAL</option><option>QUOTED</option><option>CLOSED</option></select><button onclick="load()">Refresh</button></div><div id="list" class="card empty">Loading...</div></div><script>async function load(){const s=document.getElementById('status').value;const r=await fetch('/api/admin/rfqs'+(s?'?status='+encodeURIComponent(s):''));const d=await r.json();const el=document.getElementById('list');if(!d.ok){el.textContent=d.error||'Unable to load RFQs';return}if(!d.rfqs.length){el.textContent='No RFQs yet.';return}el.innerHTML=d.rfqs.map(x=>'<div class="card row"><b><a href="detail.html?id='+encodeURIComponent(x.rfq_id)+'" style="color:#172033;text-decoration:none">'+esc(x.rfq_id)+'</a></b><span>'+esc(x.company)+'<br><small>'+esc(x.project_name||'No project')+'</small></span><span class="status">'+esc(x.status)+'</span><span>'+formatDate(x.submitted_at)+'</span></div>').join('')}function formatDate(v){if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load();</script></body></html>
