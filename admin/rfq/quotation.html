<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia | Quotation</title><style>
body{font-family:Arial,sans-serif;background:#eef2f4;margin:0;color:#172033}.sheet{max-width:1000px;margin:30px auto;background:white;padding:42px;box-shadow:0 4px 24px #0001}.head{display:flex;justify-content:space-between;border-bottom:2px solid #172033;padding-bottom:20px}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:25px 0}.box{padding:12px;background:#f7f9fa;border-radius:7px}table{width:100%;border-collapse:collapse;margin-top:25px}th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left}th{font-size:12px;text-transform:uppercase}.right{text-align:right}.total{font-size:20px;font-weight:700}.actions{margin:20px auto;max-width:1000px;display:flex;gap:10px}button{padding:11px 16px;border:0;border-radius:7px;cursor:pointer}@media print{body{background:white}.sheet{box-shadow:none;margin:0}.actions{display:none}}</style></head><body><div class="actions"><button onclick="window.print()">Print / Save PDF</button><button id="send" onclick="sendQuotation()">Send to Customer</button><button onclick="history.back()">Back</button><span id="sendMsg" style="padding:10px;color:#167d73"></span></div><main class="sheet"><div class="head"><div><div class="brand">ENERVIA</div><div class="muted">Electrical & Industrial Supply</div></div><div class="right"><b>QUOTATION</b><br><span id="qid">—</span><br><span id="qstatus">—</span><br><span id="date">—</span></div></div><div class="meta"><div class="box"><b>Customer</b><div id="customer">—</div><div id="contact"></div></div><div class="box"><b>Project / Delivery</b><div id="project">—</div><div id="delivery"></div></div></div><table><thead><tr><th>#</th><th>Description</th><th>Manufacturer</th><th>Model</th><th>Qty</th><th>Unit</th><th class="right">Unit Price</th><th class="right">Total</th></tr></thead><tbody id="rows"></tbody></table><div class="right total" id="grand">Total: —</div><p class="muted">This quotation is subject to Enervia commercial terms and final order confirmation.</p></main><script>
const id=new URLSearchParams(location.search).get("id"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
async function load(){const r=await fetch("/api/admin/rfq?id="+encodeURIComponent(id));const d=await r.json();if(!d.ok)return;const qres=await fetch("/api/admin/quotation?rfqId="+encodeURIComponent(id));const qd=await qres.json();const x=d.rfq;const q=qd.quotation;document.getElementById("qid").textContent=q?.quote_no||x.rfq_id;document.getElementById("qstatus").textContent=q?.status||"DRAFT";document.getElementById("send").disabled=!!q&&q.status!=="DRAFT";document.getElementById("qid").textContent=x.rfq_id;document.getElementById("date").textContent=new Date().toLocaleDateString();document.getElementById("customer").textContent=x.company||"—";document.getElementById("contact").textContent=x.contact_name||"";document.getElementById("project").textContent=x.project_name||"—";document.getElementById("delivery").textContent=x.delivery_location||"";let total=0;document.getElementById("rows").innerHTML=(x.items||[]).map(i=>{const p=Number(i.selling_price)||0,q=Number(i.quantity)||0,t=p*q;total+=t;return "<tr><td>"+esc(i.line_no)+"</td><td>"+esc(i.description)+"</td><td>"+esc(i.manufacturer)+"</td><td>"+esc(i.model)+"</td><td>"+esc(i.quantity)+"</td><td>"+esc(i.unit)+"</td><td class='right'>"+p.toFixed(2)+"</td><td class='right'>"+t.toFixed(2)+"</td></tr>"}).join("");document.getElementById("grand").textContent="Total: "+total.toFixed(2)+" "+esc(x.currency||"AZN")}async function sendQuotation(){const b=document.getElementById("send"),m=document.getElementById("sendMsg");b.disabled=true;m.textContent="Sending...";const r=await fetch("/api/admin/send-quotation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rfqId:id})});const d=await r.json();if(!r.ok||!d.ok){m.textContent=d.error||"Send failed";b.disabled=false;return}m.textContent="Sent to customer.";document.getElementById("qstatus").textContent="SENT"}load();
</script></body></html>
