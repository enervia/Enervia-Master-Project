<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia | RFQ Detail</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07131b;color:#eef5f7}.wrap{max-width:1280px;margin:auto;padding:32px 24px 60px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:28px}.back{color:#45d7c4;text-decoration:none}.muted{color:#91a4ad}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}.card{background:#0d202a;border:1px solid #1c3945;border-radius:14px;padding:20px;margin-top:18px}h1{margin:6px 0;font-size:30px}h2{font-size:17px;margin:0 0 18px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{padding:12px;background:#091a23;border-radius:9px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7f969f;margin-bottom:5px}.value{font-size:14px;word-break:break-word}.status{display:inline-block;padding:8px 12px;border-radius:20px;background:#163d3d;color:#45d7c4;font-weight:700;font-size:12px}select,button{padding:10px 12px;border-radius:8px;border:1px solid #34505c;background:#081922;color:#eef5f7}button{background:#45d7c4;color:#06141a;border:0;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #1c3945;font-size:13px}th{color:#8da1aa;font-size:11px;text-transform:uppercase}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msg{margin-top:12px;color:#ff9b9b;min-height:18px}.empty{padding:25px;text-align:center;color:#91a4ad}@media(max-width:850px){.grid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap">
<div class="top"><div><a class="back" href="index.html">← RFQ Inbox</a><h1 id="title">RFQ Detail</h1><div id="sub" class="muted">Loading...</div></div><span id="status" class="status">—</span></div>
<div class="grid"><section class="card"><h2>RFQ Information</h2><div class="meta" id="meta"></div></section>
<section class="card"><h2>Workflow & Pricing</h2><div class="field"><div class="label">Change status</div><div class="actions"><select id="statusSelect"><option>NEW</option><option>REVIEW</option><option>SOURCING</option><option>PRICING</option><option>PENDING_APPROVAL</option><option>QUOTED</option><option>CLOSED</option></select><button id="save">Update</button><button id="approve" type="button">Approve & Open Quotation</button></div><div id="msg" class="msg"></div></div><div class="field" style="margin-top:12px"><div class="label">Apply markup to all items %</div><div class="actions"><input id="defaultMarkup" type="number" min="0" max="1000" step="0.01" value="10" style="width:110px"><button id="savePricing" type="button">Save Markup</button><span class="muted">Enter a percentage and apply it to all line items.</span></div></div></section></div>
<section class="card"><h2>RFQ Items</h2><div id="items" class="empty">Loading items...</div></section></div>
<script>
const id=new URLSearchParams(location.search).get("id"),esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
function field(l,v){return '<div class="field"><div class="label">'+l+'</div><div class="value">'+esc(v||"—")+"</div></div>"}
async function load(){if(!id){document.getElementById("sub").textContent="Missing RFQ ID";return}const r=await fetch("/api/admin/rfq?id="+encodeURIComponent(id));const d=await r.json();if(!r.ok||!d.ok){document.getElementById("sub").textContent=d.error||"Unable to load RFQ";return}const x=d.rfq;document.getElementById("title").textContent="RFQ "+x.rfq_id;document.getElementById("sub").textContent=(x.company||"")+" · "+new Date(x.submitted_at).toLocaleString();document.getElementById("status").textContent=x.status;document.getElementById("statusSelect").value=x.status;document.getElementById("meta").innerHTML=[["RFQ ID",x.rfq_id],["Company",x.company],["Contact",x.contact_name],["Email",x.email],["Phone",x.phone],["Industry",x.industry],["Requirement",x.requirement_type],["Project",x.project_name],["Delivery",x.delivery_location],["Required by",x.required_by],["Currency",x.currency],["Priority",x.priority],["Details",x.details]].map(a=>field(a[0],a[1])).join("");const items=x.items||[];document.getElementById("items").innerHTML=items.length?'<table><thead><tr><th>Line</th><th>Description</th><th>Manufacturer</th><th>Model</th><th>Qty</th><th>Unit</th><th>Source Price</th><th>Markup %</th><th>Selling Price</th><th>Status</th></tr></thead><tbody>'+items.map(i=>'<tr><td>'+esc(i.line_no)+'</td><td>'+esc(i.description)+'</td><td>'+esc(i.manufacturer)+'</td><td>'+esc(i.model)+'</td><td>'+esc(i.quantity)+'</td><td>'+esc(i.unit)+'</td><td>'+esc(i.source_price)+'</td><td><input class="item-markup" data-id="'+esc(i.id)+'" data-source="'+esc(i.source_price)+'" type="number" min="0" max="1000" step="0.01" value="'+esc(i.markup_percent ?? x.default_markup_percent ?? 10)+'" style="width:80px;padding:6px"></td><td class="sell" data-id="'+esc(i.id)+'">'+esc(i.selling_price ?? "—")+'</td><td>'+esc(i.status)+'</td></tr>').join("")+'</tbody></table>':'<div class="empty">No item lines yet.</div>'}
document.getElementById("defaultMarkup").value=x.default_markup_percent ?? 10; document.querySelectorAll(".item-markup").forEach(input=>input.addEventListener("input",()=>{const source=Number(input.dataset.source),markup=Number(input.value);const sell=document.querySelector('.sell[data-id="'+input.dataset.id+'"]');sell.textContent=Number.isFinite(source)&&Number.isFinite(markup)?(source*(1+markup/100)).toFixed(2):"—"}));}
async function savePricing(){const msg=document.getElementById("msg");msg.style.color="#45d7c4";msg.textContent="";const items=[...document.querySelectorAll(".item-markup")].map(i=>({id:i.dataset.id,markupPercent:i.value,sourcePrice:i.dataset.source}));const r=await fetch("/api/admin/rfq-pricing",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rfqId:id,defaultMarkupPercent:document.getElementById("defaultMarkup").value,items})});const d=await r.json();if(!r.ok||!d.ok){msg.style.color="#ff9b9b";msg.textContent=d.error||"Pricing update failed";return}msg.textContent="Markup and selling prices saved.";await load()}
document.getElementById("approve").onclick=async()=>{const msg=document.getElementById("msg");if(!confirm("Approve this RFQ and move it to QUOTED?"))return;const r=await fetch("/api/admin/approve-quotation",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rfqId:id})});const d=await r.json();if(!r.ok||!d.ok){msg.style.color="#ff9b9b";msg.textContent=d.error||"Approval failed";return}location.href="quotation.html?id="+encodeURIComponent(id)};
document.getElementById("savePricing").onclick=async()=>{const value=document.getElementById("defaultMarkup").value;document.querySelectorAll(".item-markup").forEach(input=>{input.value=value;input.dispatchEvent(new Event("input"));});await savePricing()};
document.getElementById("save").onclick=async()=>{const msg=document.getElementById("msg");msg.textContent="";const status=document.getElementById("statusSelect").value;const r=await fetch("/api/admin/rfq-status",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({rfqId:id,status,changedBy:"admin"})});const d=await r.json();if(!r.ok||!d.ok){msg.textContent=d.error||"Update failed";return}msg.style.color="#45d7c4";msg.textContent="Status updated.";await load()};load();
</script></body></html>
