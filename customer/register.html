<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia Customer Registration</title><style>body{font-family:Arial;background:#07131b;color:#fff;margin:0}.box{max-width:600px;margin:50px auto;padding:28px;background:#0d202a;border-radius:14px}input{width:100%;padding:11px;box-sizing:border-box;margin:6px 0 12px}button{padding:12px 18px;background:#45d7c4;border:0;border-radius:8px;font-weight:700}</style></head><body><main class="box"><h1>Customer Registration</h1><p>Register your company for Enervia Customer Portal access.</p><label>Full Name</label><input id="fullName"><label>Email</label><input id="email" type="email"><label>Password</label><input id="password" type="password"><label>Company Legal Name</label><input id="legalName"><label>Tax ID / VÖEN</label><input id="taxId"><label>Phone</label><input id="phone"><label>Industry</label><input id="industry"><label>City</label><input id="city" value="Baku"><label>Address</label><input id="address"><button id="go">Create Account</button><p id="msg"></p><a href="login.html">Back to login</a></main><script>document.getElementById("go").onclick=async()=>{const body={fullName:fullName.value,email:email.value,password:password.value,phone:phone.value,company:{legalName:legalName.value,taxId:taxId.value,industry:industry.value,city:city.value,address:address.value}};const r=await fetch("/api/customer/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok&&d.ok?"Account created. Check email if confirmation is required; then sign in.":d.error||"Registration failed."};</script></body></html>
