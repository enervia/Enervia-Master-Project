<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enervia Customer Portal</title>
<style>
body{font-family:Arial;margin:0;background:#f5f7fa;color:#172033}
.top{background:#07131b;color:#fff;padding:18px 28px;display:flex;justify-content:space-between;align-items:center}
.top button{background:transparent;color:#fff;border:1px solid #34505c;padding:8px 12px;border-radius:8px}
.wrap{max-width:1200px;margin:30px auto;padding:0 20px}
.hero,.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.btn{display:inline-block;padding:10px 14px;border-radius:8px;background:#45d7c4;color:#06141a;text-decoration:none;border:0;font-weight:700}
.btn.disabled{opacity:.5;pointer-events:none}
.notice{margin-top:14px;padding:12px 14px;border-radius:9px;background:#f1f7f7;color:#36545b}
.item,.quote{padding:12px 0;border-bottom:1px solid #edf0f2}
.actions{display:flex;gap:8px;margin-top:10px}
.error{color:#b42318}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center}
.modal>div{background:#fff;padding:24px;border-radius:12px;max-width:430px;width:90%}
select,textarea{width:100%;box-sizing:border-box;padding:10px;margin:7px 0 12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><strong>ENERVIA · CUSTOMER PORTAL</strong><button id="logout">Sign Out</button></header>
<main class="wrap">
<section class="hero">
<h1 id="welcome">Customer Portal</h1>
<p id="company">Loading...</p>
<a id="newRfq" class="btn" href="new-rfq.html">+ Submit New RFQ</a>
<div id="pendingNotice" class="notice" style="display:none"></div>
</section>
<div class="grid">
<section class="card"><h2>My RFQs</h2><div id="rfqs">Loading...</div></section>
<section class="card"><h2>Quotations</h2><div id="quotes">Loading...</div></section>
</div>
</main>
<div class="modal" id="modal"><div><h3>Ignore quotation</h3>
<select id="reason"><option value="">Select reason</option><option value="PRICE_TOO_HIGH">Price too high</option><option value="DELIVERY_TIME">Delivery time</option><option value="SPECIFICATION">Specification mismatch</option><option value="BUDGET">Budget not approved</option><option value="PROJECT_CANCELLED">Project cancelled</option><option value="OTHER">Other</option></select>
<textarea id="note" rows="4" placeholder="Optional note"></textarea>
<button class="btn" id="confirm">Confirm Ignore</button>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from "./config.js";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let qid=null;
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));
async function api(url,opt={}){
 const{data}=await sb.auth.getSession();
 if(!data.session){location.href="login.html";return null}
 opt.headers={...(opt.headers||{}),Authorization:"Bearer "+data.session.access_token,"Content-Type":"application/json"};
 const r=await fetch(url,opt);
 let body=null;try{body=await r.json()}catch{}
 if(!r.ok||body?.ok===false){throw new Error(body?.error||"Request failed.");}
 return body;
}
async function load(){
 $("rfqs").textContent="Loading...";
 $("quotes").textContent="Loading...";
 try{
  const me=await api("/api/customer/me");
  if(!me)return;
  if(!me.active){
   $("welcome").textContent="Account pending approval";
   $("company").textContent=(me.company?.legal_name||"Your company")+" — waiting for Enervia approval.";
   $("pendingNotice").style.display="block";
   $("pendingNotice").textContent="Your account has been registered successfully. Enervia will review and activate your customer access.";
   $("newRfq").classList.add("disabled");
   $("newRfq").setAttribute("aria-disabled","true");
   $("rfqs").innerHTML="<div class='notice'>RFQ access will be available after your account is approved.</div>";
   $("quotes").innerHTML="<div class='notice'>Quotations will appear here after your account is approved.</div>";
   return;
  }
  $("pendingNotice").style.display="none";
  $("newRfq").classList.remove("disabled");
  $("welcome").textContent="Welcome, "+(me.profile?.full_name||"Customer");
  $("company").textContent=(me.company?.legal_name||"")+" · "+(me.company?.industry||"Customer");
  const d=await api("/api/customer/rfqs");
  $("rfqs").innerHTML=d.rfqs?.length?d.rfqs.map(x=>'<div class="item"><strong>'+esc(x.rfq_id)+'</strong> · '+esc(x.status)+'<br><small>'+esc(x.project_name||"No project")+' · '+(x.submitted_at?new Date(x.submitted_at).toLocaleString():"")+'</small></div>').join(""):"No RFQs yet.";
  $("quotes").innerHTML=d.quotations?.length?d.quotations.map(q=>'<div class="quote"><strong>'+esc(q.quote_no)+'</strong> · '+esc(q.status)+'<br>RFQ '+esc(q.rfq_id)+' · '+esc(q.currency||"")+' '+esc(q.grand_total||"")+(q.status==="SENT"?'<div class="actions"><button class="btn" onclick="acceptQuote(\''+q.id+'\')">Accept</button><button class="btn" style="background:#172033;color:#fff" onclick="ignoreQuote(\''+q.id+'\')">Ignore</button></div>':"")+'</div>').join(""):"No quotations yet.";
 }catch(e){
  console.error(e);
  $("rfqs").innerHTML="<div class='error'>Unable to load your profile. If you registered but your company is missing, <a href=\"complete-registration.html\">complete company registration here</a>.</div>";
  $("quotes").innerHTML="<div class='error'>Unable to load quotations. Please refresh the page.</div>";
 }
}
window.acceptQuote=async id=>{
 if(!confirm("Accept this quotation?"))return;
 try{const d=await api("/api/customer/quotation-decision",{method:"POST",body:JSON.stringify({quotationId:id,decision:"ACCEPT"})});if(!d?.ok)throw new Error(d?.error||"Unable to save decision");load()}catch(e){alert(e.message)}
};
window.ignoreQuote=id=>{qid=id;$("modal").style.display="flex"};
$("confirm").onclick=async()=>{
 if(!$("reason").value){alert("Select a reason");return}
 try{const d=await api("/api/customer/quotation-decision",{method:"POST",body:JSON.stringify({quotationId:qid,decision:"IGNORE",reason:$("reason").value,note:$("note").value})});if(!d?.ok)throw new Error(d?.error||"Unable to save decision");$("modal").style.display="none";$("reason").value="";$("note").value="";load()}catch(e){alert(e.message)}
};
$("logout").onclick=async()=>{await sb.auth.signOut();location.href="login.html"};
load();
</script>
</body>
</html>
