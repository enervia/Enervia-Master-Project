<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia Customer RFQ</title><style>body{font-family:Arial;margin:0;background:#f5f7fa;color:#172033}.wrap{max-width:900px;margin:35px auto;padding:0 20px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:24px}label{display:block;margin:12px 0 6px;color:#667085;font-size:12px}input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}button{margin-top:18px;padding:12px 18px;background:#45d7c4;border:0;border-radius:8px;font-weight:700}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main class="wrap"><a href="index.html">← Customer Portal</a><div class="card"><h1>Submit New RFQ</h1><p>Upload a BOQ, Excel, PDF, Word file or specification.</p><form id="form" enctype="multipart/form-data"><div class="grid"><div><label>Requirement type</label><input name="type"></div><div><label>Industry</label><input name="industry"></div><div><label>Project name</label><input name="projectName"></div><div><label>Delivery location</label><input name="deliveryLocation" value="Azerbaijan"></div><div><label>Required by</label><input name="requiredBy" type="date"></div><div><label>Currency</label><select name="currency"><option>AZN</option><option>USD</option><option>EUR</option></select></div><div class="full"><label>Requirement / specification *</label><textarea name="details" rows="8" required></textarea></div><div class="full"><label>Attachment — max 10 MB</label><input name="file" type="file" accept=".pdf,.xlsx,.xls,.docx,.doc,.jpg,.jpeg,.png"></div></div><button>Submit RFQ</button></form><p id="msg"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from "./config.js";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);form.onsubmit=async e=>{e.preventDefault();const{data}=await sb.auth.getSession();if(!data.session){location.href="login.html";return}const fd=new FormData(form);fd.append("language","en");const r=await fetch("/api/rfq",{method:"POST",headers:{Authorization:"Bearer "+data.session.access_token},body:fd});const d=await r.json();if(!r.ok||!d.ok){msg.textContent=d.error||"Submission failed";return}msg.textContent="RFQ "+d.rfqId+" submitted successfully.";form.reset()};</script></body></html>
