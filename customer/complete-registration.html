<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complete Customer Registration</title><style>body{font:16px Arial;background:#f5f7fa;color:#172033}.box{max-width:550px;margin:40px auto;padding:25px;background:white;border-radius:12px}input,button{box-sizing:border-box;width:100%;padding:12px;margin:8px 0}button{background:#45d7c4;border:0;cursor:pointer}</style></head><body><main class="box"><h2>Complete Company Registration</h2><p>Your login exists, but your company profile may be missing. Complete it here; Enervia will review your application.</p><form id="form"><input name="fullName" placeholder="Full name" required><input name="legalName" placeholder="Company legal name" required><input name="taxId" placeholder="Tax ID / VÖEN"><input name="phone" placeholder="Phone"><input name="industry" placeholder="Industry"><input name="city" placeholder="City"><input name="address" placeholder="Address"><button>Complete registration</button></form><p id="msg"></p><a href="index.html">Back to Customer Portal</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module">import{SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY}from "./config.js";const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);document.getElementById("form").onsubmit=async e=>{e.preventDefault();const msg=document.getElementById("msg");try{const {data}=await sb.auth.getSession();if(!data.session){location.href="login.html";return}const body=Object.fromEntries(new FormData(e.target));const r=await fetch("/api/customer/complete-registration",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+data.session.access_token},body:JSON.stringify(body)});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||"Registration failed");msg.textContent="Company profile created. Awaiting approval in Enervia CRM.";e.target.reset()}catch(err){msg.textContent=err.message}};</script></body></html>
