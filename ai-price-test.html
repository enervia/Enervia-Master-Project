<!doctype html><html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enervia AI Price Collector — Test</title><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:1200px;margin:40px auto;padding:0 20px}.card{background:white;border:1px solid #e4e8ef;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 4px 18px #00000008}button{background:#0b63ce;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}input[type=file]{padding:10px}.muted{color:#667085}.status{padding:12px;background:#eef5ff;border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left;vertical-align:top}th{background:#f8fafc}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf7ef;color:#16723d;font-size:12px}.warn{background:#fff4e5;color:#9a5a00}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;padding:14px;border-radius:10px}.price{font-weight:800;font-size:18px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}table{font-size:13px}}</style></head><body><div class="wrap"><h1>AI Price Collector <span class="muted">Test</span></h1><p class="muted">Excel-dəki məhsul adı + ətraflı texniki təsvir + miqdar analiz olunur. Sistem yerli təchizatçıları axtarır, qiymətləri və texniki uyğunluğu müqayisə edir.</p><div class="card"><input id="file" type="file" accept=".xlsx,.xls"> <button id="run" disabled>Qiymətləri topla</button><div id="status" class="status">Excel faylını seçin.</div></div><div id="summary" class="grid"></div><div class="card"><div id="results"></div></div></div><script>
let rows=[];const file=document.getElementById('file'),run=document.getElementById('run'),status=document.getElementById('status');
file.onchange=async()=>{try{const b=await file.files[0].arrayBuffer(),wb=XLSX.read(b,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''}),h=data.findIndex(r=>String(r[0]).trim()==='№');rows=data.slice(h+1).filter(r=>r[0]&&r[1]).map(r=>({no:r[0],name:r[1],description:r[2],qty:r[3],unit:r[4]}));status.textContent=rows.length+' məhsul oxundu. Texniki təsvirlər hazırdır.';run.disabled=!rows.length}catch(e){status.textContent='Excel oxunmadı: '+e.message}};
run.onclick=async()=>{run.disabled=true;status.textContent='Yerli bazar üzrə axtarış gedir...';document.getElementById('results').innerHTML='';try{const resp=await fetch('/api/price-search',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({items:rows})}),out=await resp.json();if(!resp.ok)throw Error(out.error||'Server xətası');document.getElementById('summary').innerHTML='<div class="stat"><b>'+out.items.length+'</b><br><span class="muted">Məhsul</span></div><div class="stat"><b>'+out.suppliers+'</b><br><span class="muted">Təchizatçı nəticəsi</span></div><div class="stat"><b>'+out.priced+'</b><br><span class="muted">Qiymət tapıldı</span></div><div class="stat"><b>'+out.exact+'</b><br><span class="muted">Yüksək uyğunluq</span></div>';let html='<table><tr><th>#</th><th>Məhsul / tələb</th><th>Ən uyğun nəticələr</th></tr>';for(const x of out.items)html+='<tr><td>'+x.no+'</td><td><b>'+esc(x.name)+'</b><br><small>'+esc(x.description||'')+'</small><br><br>Miqdar: '+esc(x.qty)+' '+esc(x.unit)+'</td><td>'+x.results.map(r=>'<div style="margin-bottom:12px"><span class="badge '+(r.score<70?'warn':'')+'">'+r.score+'% uyğunluq</span> <b>'+esc(r.title)+'</b><br>'+(r.price?'<span class="price">'+esc(r.price)+'</span>':'Qiymət tapılmadı')+' · '+esc(r.domain)+'<br><small>'+esc(r.snippet||'')+'</small><br><a href="'+r.url+'" target="_blank" rel="noopener">Mənbəyə bax →</a></div>').join('')+'</td></tr>';html+='</table>';document.getElementById('results').innerHTML=html;status.textContent='Hazırdır. Nəticələr uyğunluğa görə sıralandı.'}catch(e){status.textContent='Xəta: '+e.message}finally{run.disabled=false}};
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
